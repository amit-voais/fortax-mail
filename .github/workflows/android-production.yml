name: Android production candidate

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Monotonically increasing Play version code
        required: true
        type: string
      version_name:
        description: Public release version, for example 1.2.3
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Signed Android APK and AAB
    runs-on: ubuntu-24.04
    # Configure this environment with required reviewers before adding secrets.
    environment: android-production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: platform/android -> ../../target
          key: android-production-arm64
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Configure Android NDK compiler
        run: |
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$toolchain/aarch64-linux-android26-clang"
          {
            echo "CC_aarch64_linux_android=$toolchain/aarch64-linux-android26-clang"
            echo "CXX_aarch64_linux_android=$toolchain/aarch64-linux-android26-clang++"
            echo "AR_aarch64_linux_android=$toolchain/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$toolchain/aarch64-linux-android26-clang"
          } >> "$GITHUB_ENV"

      - name: Materialize protected upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FORTAX_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          keystore="$RUNNER_TEMP/fortax-upload.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "FORTAX_ANDROID_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Build and validate production candidate
        env:
          FORTAX_ANDROID_VERSION_CODE: ${{ inputs.version_code }}
          FORTAX_ANDROID_VERSION_NAME: ${{ inputs.version_name }}
          FORTAX_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.FORTAX_GOOGLE_ANDROID_CLIENT_ID }}
          FORTAX_MICROSOFT_ANDROID_CLIENT_ID: ${{ secrets.FORTAX_MICROSOFT_ANDROID_CLIENT_ID }}
          FORTAX_MICROSOFT_ANDROID_REDIRECT_URI: ${{ secrets.FORTAX_MICROSOFT_ANDROID_REDIRECT_URI }}
          FORTAX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FORTAX_ANDROID_KEYSTORE_PASSWORD }}
          FORTAX_ANDROID_KEY_ALIAS: ${{ secrets.FORTAX_ANDROID_KEY_ALIAS }}
          FORTAX_ANDROID_KEY_PASSWORD: ${{ secrets.FORTAX_ANDROID_KEY_PASSWORD }}
        run: ./scripts/build-android-release.sh

      - name: Record public signing identities
        run: |
          ./scripts/android-signing-identities.sh \
            target/android/production/fortax-mail.apk \
            > target/android/production/signing-identities.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fortax-mail-android-production-${{ inputs.version_name }}
          path: |
            target/android/production/fortax-mail.apk
            target/android/production/fortax-mail.aab
            target/android/production/signing-identities.txt
          if-no-files-found: error
          retention-days: 30

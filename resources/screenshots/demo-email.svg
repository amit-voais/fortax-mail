<svg width="720" height="760" viewBox="0 0 720 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Demo newsletter: a weekly traffic report">
  <style>
    .s { font-family: Helvetica, Arial, sans-serif; }
    .eyebrow { font: 700 12px Helvetica, Arial, sans-serif; letter-spacing: .14em; }
    .h { font: 700 34px Helvetica, Arial, sans-serif; letter-spacing: -.02em; }
    .p { font: 400 15px Helvetica, Arial, sans-serif; }
    .lab { font: 700 11px Helvetica, Arial, sans-serif; letter-spacing: .1em; }
    .num { font: 700 30px Helvetica, Arial, sans-serif; letter-spacing: -.02em; }
    .sub { font: 400 12.5px Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4E8"/><stop offset="1" stop-color="#FFFDFA"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5E1F" stop-opacity=".28"/><stop offset="1" stop-color="#FF5E1F" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="720" height="760" fill="#EEF2F7"/>
  <rect x="36" y="20" width="648" height="720" rx="22" fill="#FFFFFF"/>

  <!-- masthead -->
  <rect x="36" y="20" width="648" height="250" rx="22" fill="url(#warm)"/>
  <rect x="36" y="248" width="648" height="22" fill="#FFFDFA"/>
  <text class="eyebrow" x="72" y="76" fill="#9A5A2B">WEEKLY INSIGHTS</text>
  <text class="sub" x="648" y="76" text-anchor="end" fill="#A1795C">Sep 1–7, 2026</text>
  <text class="h" x="72" y="130" fill="#171A1F">A faster week for fortax.in</text>
  <text class="p" x="72" y="163" fill="#4A5361">Traffic grew while performance and security stayed strong.</text>
  <rect x="72" y="190" width="132" height="32" rx="16" fill="#FF5E1F"/>
  <text class="lab" x="138" y="210" text-anchor="middle" fill="#FFFFFF">18.2% GROWTH</text>

  <!-- three figures -->
  <g>
    <rect x="68" y="300" width="184" height="120" rx="14" fill="#FFFFFF" stroke="#E6EAF0"/>
    <circle cx="92" cy="330" r="5" fill="#FF5E1F"/>
    <text class="lab" x="106" y="334" fill="#6B7480">REQUESTS</text>
    <text class="num" x="92" y="378" fill="#171A1F">1.24M</text>
    <text class="sub" x="92" y="400" fill="#17A34A">↑ 18.2% vs last week</text>
  </g>
  <g>
    <rect x="268" y="300" width="184" height="120" rx="14" fill="#FFFFFF" stroke="#E6EAF0"/>
    <circle cx="292" cy="330" r="5" fill="#3257E0"/>
    <text class="lab" x="306" y="334" fill="#6B7480">BANDWIDTH</text>
    <text class="num" x="292" y="378" fill="#171A1F">38.6 GB</text>
    <text class="sub" x="292" y="400" fill="#17A34A">↑ 9.4% vs last week</text>
  </g>
  <g>
    <rect x="468" y="300" width="184" height="120" rx="14" fill="#FFFFFF" stroke="#E6EAF0"/>
    <circle cx="492" cy="330" r="5" fill="#17A34A"/>
    <text class="lab" x="506" y="334" fill="#6B7480">THREATS BLOCKED</text>
    <text class="num" x="492" y="378" fill="#171A1F">2,849</text>
    <text class="sub" x="492" y="400" fill="#6B7480">99.98% clean traffic</text>
  </g>

  <!-- the week, drawn -->
  <text class="h" x="68" y="470" fill="#171A1F" style="font-size:20px">Requests over the last 7 days</text>
  <text class="sub" x="652" y="470" text-anchor="end" fill="#6B7480">Peak: Tue, 14:00 UTC</text>
  <g>
    <line x1="68" y1="600" x2="652" y2="600" stroke="#EDF1F6"/>
    <line x1="68" y1="550" x2="652" y2="550" stroke="#EDF1F6"/>
    <line x1="68" y1="500" x2="652" y2="500" stroke="#EDF1F6"/>
    <path d="M68 572 C 108 568, 132 508, 165 502 C 205 495, 232 536, 262 546 C 312 562, 330 566, 359 562 C 400 556, 424 534, 456 536 C 500 539, 520 560, 553 558 C 590 556, 620 538, 652 532 L652 600 L68 600 Z" fill="url(#spark)"/>
    <path d="M68 572 C 108 568, 132 508, 165 502 C 205 495, 232 536, 262 546 C 312 562, 330 566, 359 562 C 400 556, 424 534, 456 536 C 500 539, 520 560, 553 558 C 590 556, 620 538, 652 532"
          fill="none" stroke="#FF5E1F" stroke-width="3" stroke-linecap="round"/>
    <circle cx="165" cy="502" r="6" fill="#FFFFFF" stroke="#FF5E1F" stroke-width="3"/>
    <g class="sub" fill="#98A1AD">
      <text x="68" y="622">Mon</text><text x="165" y="622">Tue</text><text x="262" y="622">Wed</text>
      <text x="359" y="622">Thu</text><text x="456" y="622">Fri</text><text x="553" y="622">Sat</text>
      <text x="632" y="622">Sun</text>
    </g>
  </g>

  <!-- footer note -->
  <rect x="68" y="650" width="584" height="62" rx="14" fill="#F6F8FB"/>
  <text class="p" x="92" y="678" fill="#4A5361">All systems are healthy. No action is needed for your domains</text>
  <text class="p" x="92" y="698" fill="#4A5361">this week.</text>
</svg>

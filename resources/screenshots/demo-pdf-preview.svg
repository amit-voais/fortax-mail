<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Demo document preview: a preview plan">
  <style>
    .brand { font: 700 15px Helvetica, Arial, sans-serif; letter-spacing: .12em; }
    .meta { font: 400 11px Helvetica, Arial, sans-serif; letter-spacing: .1em; }
    .chip { font: 700 10px Helvetica, Arial, sans-serif; letter-spacing: .1em; }
    .title { font: 700 46px Helvetica, Arial, sans-serif; letter-spacing: -.03em; }
    .lede { font: 400 15px Helvetica, Arial, sans-serif; }
    .lab { font: 700 10px Helvetica, Arial, sans-serif; letter-spacing: .12em; }
    .val { font: 700 13px Helvetica, Arial, sans-serif; }
    .eyebrow { font: 700 11px Helvetica, Arial, sans-serif; letter-spacing: .14em; }
    .h2 { font: 700 21px Helvetica, Arial, sans-serif; letter-spacing: -.02em; }
    .p { font: 400 13.5px Helvetica, Arial, sans-serif; }
    .num { font: 700 26px Helvetica, Arial, sans-serif; letter-spacing: -.02em; }
    .sub { font: 400 11px Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101A3C"/><stop offset="1" stop-color="#20347E"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="#F3F5F9"/>

  <rect x="30" y="26" width="26" height="26" rx="7" fill="#3257E0"/>
  <text class="brand" x="66" y="45" fill="#171A1F">FORTAX MAIL</text>
  <text class="meta" x="570" y="44" text-anchor="end" fill="#8A93A0">PREVIEW / PLAN · 01</text>

  <rect x="30" y="68" width="540" height="222" rx="16" fill="url(#ink)"/>
  <circle cx="520" cy="120" r="78" fill="#FFFFFF" opacity=".05"/>
  <rect x="58" y="94" width="126" height="22" rx="11" fill="#FFFFFF" opacity=".14"/>
  <circle cx="72" cy="105" r="3.5" fill="#8FB0FF"/>
  <text class="chip" x="84" y="109" fill="#DCE6FF">INTERNAL · V0.9</text>
  <text class="title" x="58" y="166" fill="#FFFFFF">Preview plan</text>
  <text class="lede" x="58" y="196" fill="#C3D0F2">From a private preview to a first release the firm</text>
  <text class="lede" x="58" y="216" fill="#C3D0F2">can rely on.</text>
  <line x1="58" y1="238" x2="382" y2="238" stroke="#FFFFFF" opacity=".18"/>
  <text class="lab" x="58" y="262" fill="#9FB3E8">TARGET</text>
  <text class="val" x="112" y="263" fill="#FFFFFF">8 October 2026</text>
  <text class="lab" x="232" y="262" fill="#9FB3E8">OWNER</text>
  <text class="val" x="282" y="263" fill="#FFFFFF">Fortax Engineering</text>
  <g transform="translate(496,112)">
    <circle cx="0" cy="0" r="30" fill="#3257E0"/>
    <path d="M-12 1 L-4 9 L13 -9" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text class="eyebrow" x="32" y="332" fill="#3257E0">EXECUTIVE BRIEF</text>
  <text class="h2" x="32" y="362" fill="#171A1F">Prove it on a real practice first.</text>
  <text class="p" x="32" y="392" fill="#4A5361">The preview has one job: show that mail, calendar and contacts stay</text>
  <text class="p" x="32" y="412" fill="#4A5361">fast and dependable on a working CA firm's machine, offline included.</text>
  <text class="p" x="32" y="444" fill="#4A5361">Access widens in measured cohorts. The hiSAI bridge stays off unless</text>
  <text class="p" x="32" y="464" fill="#4A5361">the firm switches it on, and sending always waits for a person.</text>

  <rect x="30" y="486" width="540" height="88" rx="14" fill="#FFFFFF" stroke="#E6EAF0"/>
  <text class="lab" x="52" y="512" fill="#8A93A0">RELEASE SNAPSHOT</text>
  <line x1="214" y1="500" x2="214" y2="560" stroke="#EDF1F6"/>
  <line x1="382" y1="500" x2="382" y2="560" stroke="#EDF1F6"/>
  <text class="num" x="52" y="546" fill="#171A1F">1,000</text>
  <text class="sub" x="52" y="562" fill="#6B7480">preview seats</text>
  <rect x="134" y="532" width="66" height="17" rx="8.5" fill="#E8F7EE"/>
  <text class="chip" x="167" y="544" text-anchor="middle" fill="#17803D">ON TRACK</text>
  <text class="num" x="236" y="546" fill="#171A1F">3</text>
  <text class="sub" x="236" y="562" fill="#6B7480" style="font-size:10px">platforms · macOS · Windows · Linux</text>
  <text class="num" x="404" y="546" fill="#171A1F">3 gates</text>
  <text class="sub" x="404" y="562" fill="#6B7480">quality · preview · publish</text>
</svg>
